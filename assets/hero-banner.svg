<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e143f"/>
      <stop offset="45%" stop-color="#0f0c24"/>
      <stop offset="100%" stop-color="#07060f"/>
    </radialGradient>

    <!-- Nebula Lights -->
    <radialGradient id="nebulaCyan" cx="80%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaViolet" cx="20%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaEmerald" cx="50%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Shimmers -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0e7ff"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="scannerBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes orbitClockwise {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes orbitCounter {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.65; transform: scale(1); }
        50% { opacity: 0.95; transform: scale(1.04); }
      }
      @keyframes scanSwipe {
        0% { transform: translateY(-160px); opacity: 0; }
        25% { opacity: 0.6; }
        75% { opacity: 0.6; }
        100% { transform: translateY(160px); opacity: 0; }
      }
      @keyframes beaconBlink {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      @keyframes packetTrack {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes liveStreamText {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
      }

      .orbit-ring-1 {
        transform-origin: 155px 160px;
        animation: orbitClockwise 22s linear infinite;
      }
      .orbit-ring-2 {
        transform-origin: 155px 160px;
        animation: orbitCounter 32s linear infinite;
      }
      .shield-group {
        transform-origin: 155px 160px;
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .scanner-line {
        animation: scanSwipe 4s ease-in-out infinite;
      }
      .beacon {
        animation: beaconBlink 2s ease-in-out infinite;
      }
      .circuit-flow {
        stroke-dasharray: 12 8;
        animation: packetTrack 6s linear infinite;
      }
      .floating-badge {
        animation: floatCard 5s ease-in-out infinite;
      }
      .tag-pulse {
        animation: liveStreamText 2.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Deep Canvas Frame -->
  <rect width="920" height="320" rx="16" fill="url(#bgGlow)"/>
  <rect width="920" height="320" rx="16" fill="url(#nebulaCyan)"/>
  <rect width="920" height="320" rx="16" fill="url(#nebulaViolet)"/>
  <rect width="920" height="320" rx="16" fill="url(#nebulaEmerald)"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="40" x2="920" y2="40"/>
    <line x1="0" y1="80" x2="920" y2="80"/>
    <line x1="0" y1="120" x2="920" y2="120"/>
    <line x1="0" y1="160" x2="920" y2="160"/>
    <line x1="0" y1="200" x2="920" y2="200"/>
    <line x1="0" y1="240" x2="920" y2="240"/>
    <line x1="0" y1="280" x2="920" y2="280"/>

    <line x1="80" y1="0" x2="80" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="240" y1="0" x2="240" y2="320"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="560" y1="0" x2="560" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="720" y1="0" x2="720" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="880" y1="0" x2="880" y2="320"/>
  </g>

  <!-- Glowing Circuit Highway Lines -->
  <g opacity="0.45">
    <path d="M 230 160 L 320 160 L 350 120 L 520 120" fill="none" stroke="#8b5cf6" stroke-width="1.5" class="circuit-flow"/>
    <path d="M 230 170 L 300 170 L 330 210 L 600 210" fill="none" stroke="#06b6d4" stroke-width="1.5" class="circuit-flow"/>
    <circle cx="520" cy="120" r="3.5" fill="#a78bfa" filter="url(#softGlow)"/>
    <circle cx="600" cy="210" r="3.5" fill="#38bdf8" filter="url(#softGlow)"/>
  </g>

  <!-- LEFT: Interactive Cryptographic Shield & Reactor -->
  <g id="shieldReactor">
    <!-- Orbital Ring 1 -->
    <circle cx="155" cy="160" r="88" fill="none" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="14 10" opacity="0.5" class="orbit-ring-1"/>
    <!-- Orbital Ring 2 -->
    <circle cx="155" cy="160" r="106" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="8 14 2 14" opacity="0.4" class="orbit-ring-2"/>
    <!-- Orbital Satellites -->
    <g class="orbit-ring-1">
      <circle cx="155" cy="72" r="4.5" fill="#06b6d4" filter="url(#softGlow)"/>
      <circle cx="155" cy="248" r="3.5" fill="#8b5cf6" filter="url(#softGlow)"/>
    </g>
    <g class="orbit-ring-2">
      <circle cx="261" cy="160" r="4" fill="#a855f7" filter="url(#softGlow)"/>
      <circle cx="49" cy="160" r="3" fill="#10b981" filter="url(#softGlow)"/>
    </g>

    <!-- Reactor Halo Aura -->
    <circle cx="155" cy="160" r="62" fill="url(#shieldGrad)" opacity="0.18" filter="url(#glowFilter)"/>

    <!-- Central High-Tech Shield -->
    <g class="shield-group" filter="url(#glowFilter)">
      <path d="M 155 106 L 195 124 C 195 168 178 196 155 210 C 132 196 115 168 115 124 Z"
            fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8"/>
      <!-- Inner Shield Core Lines -->
      <path d="M 155 118 L 183 131 C 183 162 170 183 155 195 C 140 183 127 162 127 131 Z"
            fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.5"/>
      <!-- Quantum Keyhole Icon -->
      <path d="M 155 142 A 8 8 0 1 0 155 158 L 158 174 L 152 174 Z"
            fill="#ffffff" opacity="0.95"/>
    </g>
  </g>

  <!-- Laser Scanline Sweeping across shield area -->
  <g clip-path="url(#shieldClip)">
    <clipPath id="shieldClip">
      <rect x="50" y="50" width="210" height="220" rx="12"/>
    </clipPath>
    <rect x="50" y="160" width="210" height="12" fill="url(#scannerBeam)" class="scanner-line"/>
  </g>

  <!-- RIGHT: Typography & Feature Showcase -->
  <g transform="translate(320, 0)">
    <!-- Top Status Banner -->
    <g transform="translate(0, 48)">
      <rect width="270" height="26" rx="13" fill="#1e183a" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
      <!-- Status Beacon -->
      <circle cx="14" cy="13" r="4.5" fill="#10b981" class="beacon" filter="url(#softGlow)"/>
      <circle cx="14" cy="13" r="2" fill="#ffffff"/>
      <text x="26" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">
        HS512 QUANTUM VAULT • ACTIVE
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="124" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.03em">
      VaultKey Enterprise
    </text>

    <!-- Subtitle -->
    <text x="0" y="156" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" letter-spacing="-0.01em">
      Hardware-Enforced License Verification &amp; Zero-Leak AES-256-GCM Vault
    </text>

    <!-- Live Telemetry Matrix Badges -->
    <g transform="translate(0, 184)">
      <!-- Badge 1: Algorithm -->
      <g class="floating-badge">
        <rect width="138" height="34" rx="8" fill="#120e26" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.5"/>
        <text x="14" y="21" fill="#c084fc" font-family="monospace" font-size="12" font-weight="700">🔐 HS512 JWT</text>
      </g>
      <!-- Badge 2: AES-256-GCM -->
      <g transform="translate(148, 0)" class="floating-badge">
        <rect width="158" height="34" rx="8" fill="#0c182c" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5"/>
        <text x="14" y="21" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">🛡️ AES-256-GCM</text>
      </g>
      <!-- Badge 3: HWID Machine Lock -->
      <g transform="translate(316, 0)" class="floating-badge">
        <rect width="144" height="34" rx="8" fill="#08221c" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
        <text x="14" y="21" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">⚡ HWID LOCKED</text>
      </g>
      <!-- Badge 4: Chrome Extension -->
      <g transform="translate(470, 0)" class="floating-badge">
        <rect width="95" height="34" rx="8" fill="#24142f" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.5"/>
        <text x="14" y="21" fill="#fb7185" font-family="monospace" font-size="12" font-weight="700">🧩 MV3 EXT</text>
      </g>
    </g>

    <!-- Live Interactive Terminal Output Preview -->
    <g transform="translate(0, 238)">
      <rect width="565" height="48" rx="8" fill="#06050d" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <circle cx="16" cy="16" r="3.5" fill="#ef4444"/>
      <circle cx="28" cy="16" r="3.5" fill="#f59e0b"/>
      <circle cx="40" cy="16" r="3.5" fill="#10b981"/>
      <text x="56" y="20" fill="#64748b" font-family="monospace" font-size="11">bash ~ node verification</text>

      <text x="16" y="38" fill="#10b981" font-family="monospace" font-size="12" font-weight="600" class="tag-pulse">
        ✓ [200 OK] Key: VKPRO-7X9B-4KQ2-9M1L • Hardware: SRV-PROD-US-01 • Activations: 1/10 • Integrity: Verified
      </text>
    </g>
  </g>

  <!-- Border Highlight -->
  <rect width="920" height="320" rx="16" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
</svg>
